<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bubu və Dünya</title>
<script src="../log.js"></script>
<meta name="description" content="4–6 yaşlı uşaqlar üçün öyrədici oyun: rənglər, fiqurlar, heyvanlar, meyvə və tərəvəzlər, fəsillər, bədən üzvləri.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== "sticker book" look: paper background, thick ink outlines, hard offset shadows ===== */
  :root{
    --u:min(1.1vw,1.1vh,12px);
    --ink:#2b2346;--paper:#fff4e0;--dot:#f0d9b0;
    --mustard:#ffcf4a;--coral:#ff7a6b;--teal:#3ec1b0;--lilac:#b69cff;--sky:#7cc6ff;--leaf:#5cc96b;
    --acc:var(--coral);
    --bw:max(2.5px,calc(var(--u)*.45));
    --ol:var(--bw) solid var(--ink);
    --hs:calc(var(--u)*.9) calc(var(--u)*.9) 0 var(--ink);
    --hs2:calc(var(--u)*.45) calc(var(--u)*.45) 0 var(--ink);
  }
  body[data-kid="boy"]{--acc:var(--teal)}
  @supports (height:1dvh){:root{--u:min(1.1vw,1.1dvh,12px)}}
  @media (orientation:portrait){
    :root{--u:min(1.3vw,.95vh,12px)}
    @supports (height:1dvh){:root{--u:min(1.3vw,.95dvh,12px)}}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden}
  html{background:var(--paper)}
  body{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:var(--ink);background:var(--paper);touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
  button:focus{outline:none}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:max(4px,calc(var(--u)*.7)) dashed var(--acc);outline-offset:4px}
  a{color:inherit}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;
          background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:22px 22px;
          padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .screen.on{display:flex}
  .blob{position:absolute;z-index:0;pointer-events:none;border-radius:43% 57% 61% 39%/45% 38% 62% 55%;opacity:.55}

  /* squircle sticker buttons */
  .sq{flex:none;width:max(48px,calc(var(--u)*11));height:max(48px,calc(var(--u)*11));border-radius:32%;background:var(--c,#fff);border:var(--ol);box-shadow:var(--hs2);
      font-size:max(22px,calc(var(--u)*5.2));display:grid;place-items:center;line-height:1;transition:transform .1s,box-shadow .1s}
  .sq:active{transform:translate(calc(var(--u)*.45),calc(var(--u)*.45));box-shadow:none}
  .hd{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.6) calc(var(--u)*2.4)}
  .grow{flex:1}
  .tag{background:#fff;border:var(--ol);border-radius:99px;padding:2px 14px;font-weight:700;font-size:max(17px,calc(var(--u)*4.4));box-shadow:var(--hs2)}
  .langs{display:flex;gap:4px;background:#fff;border:var(--ol);border-radius:14px;padding:3px;box-shadow:var(--hs2)}
  .langs button{font-weight:700;font-size:max(15px,calc(var(--u)*3.4));color:var(--ink);padding:1px 11px;border-radius:9px}
  .langs button.on{background:var(--ink);color:#fff}

  /* ===== HOME ===== */
  .hm{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:0 calc(var(--u)*3) calc(var(--u)*3)}
  @media (orientation:landscape){.hm{flex-direction:row;gap:calc(var(--u)*7)}}
  .brand{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
  .label{display:inline-block;background:var(--mustard);border:var(--ol);box-shadow:var(--hs);border-radius:calc(var(--u)*3);padding:calc(var(--u)*.4) calc(var(--u)*4);
         transform:rotate(-4deg);text-align:center;line-height:1}
  .label b{display:block;font-size:calc(var(--u)*13);font-weight:700;letter-spacing:1px}
  .label small{display:block;font-size:calc(var(--u)*5.2);font-weight:600;margin-top:-.15em}
  #homeZ{width:calc(var(--u)*30);cursor:pointer;margin-top:calc(var(--u)*-1)}
  @media (orientation:portrait){#homeZ{width:calc(var(--u)*24)}}
  .who{position:relative;background:#fff;border:var(--ol);box-shadow:var(--hs);border-radius:calc(var(--u)*5);padding:calc(var(--u)*2.4) calc(var(--u)*3) calc(var(--u)*3);
       display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);transform:rotate(1deg)}
  .who h2{margin:0;font-size:max(20px,calc(var(--u)*5.4));font-weight:700;line-height:1}
  .kids{display:flex;gap:calc(var(--u)*3)}
  .kid{position:relative;width:min(calc(var(--u)*25),30vw);border:var(--ol);border-radius:calc(var(--u)*4);background:#fff7ee;box-shadow:var(--hs2);padding:calc(var(--u)*1.2) calc(var(--u)*1) calc(var(--u)*.6);
       display:flex;flex-direction:column;align-items:center;transition:transform .15s,background .15s}
  .kid svg{width:78%;height:auto;display:block}
  .kid span{font-weight:700;font-size:max(16px,calc(var(--u)*4.2));line-height:1.2}
  .kid.girl.on{background:#ffd9d3}
  .kid.boy.on{background:#c9f2ec}
  .kid.on{transform:rotate(-3deg) scale(1.06)}
  .kid.on:after{content:"✔";position:absolute;top:calc(var(--u)*-2);right:calc(var(--u)*-2);width:max(26px,calc(var(--u)*7));height:max(26px,calc(var(--u)*7));border-radius:50%;
       background:var(--leaf);color:#fff;border:var(--ol);display:grid;place-items:center;font-size:max(14px,calc(var(--u)*3.6))}
  .nm{display:flex;align-items:center;gap:calc(var(--u)*1.4)}
  .nm label{font-size:max(22px,calc(var(--u)*6))}
  .nm input{font:inherit;font-weight:700;font-size:max(18px,calc(var(--u)*5));width:min(calc(var(--u)*40),56vw);padding:calc(var(--u)*.6) calc(var(--u)*2.4);border:var(--ol);border-radius:99px;
            color:var(--ink);background:#fffdf8;text-align:center;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(43,35,70,.08)}
  .start{display:flex;align-items:center;gap:calc(var(--u)*1.6);background:var(--leaf);color:#fff;border:var(--ol);box-shadow:var(--hs);border-radius:calc(var(--u)*4);
         padding:calc(var(--u)*1) calc(var(--u)*5);font-weight:700;font-size:max(24px,calc(var(--u)*7));text-shadow:0 2px 0 rgba(43,35,70,.35);transition:transform .1s,box-shadow .1s}
  .start:active{transform:translate(calc(var(--u)*.9),calc(var(--u)*.9));box-shadow:none}
  .start i{font-style:normal;animation:nudge 1.2s ease-in-out infinite}
  .vnote{position:relative;z-index:1;margin:0 auto calc(var(--u)*2);max-width:640px;padding:0 16px;text-align:center;font-size:14px;font-weight:600}
  .vnote:empty{display:none}

  /* ===== MAP: a winding trail ===== */
  .trail{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .trail::-webkit-scrollbar{display:none}
  .track{position:relative;width:100%;max-width:760px;margin:0 auto}
  .track svg.road{position:absolute;left:0;top:0;pointer-events:none}
  .st{position:absolute;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:var(--ol);box-shadow:var(--hs);
      display:grid;place-items:center;font-size:calc(var(--s)*.46);line-height:1;transition:transform .12s}
  .st:active{transform:translate(-50%,-50%) scale(.94)}
  .st .no{position:absolute;top:-8%;left:-8%;min-width:34%;height:34%;border-radius:30%;background:#fff;border:var(--ol);font-size:calc(var(--s)*.18);font-weight:700;display:grid;place-items:center;padding:0 3px}
  .st .sr{position:absolute;top:96%;left:50%;transform:translateX(-50%);background:#fff;border:var(--ol);border-radius:99px;padding:0 calc(var(--s)*.07);white-space:nowrap;
          font-size:calc(var(--s)*.17);line-height:1.25;color:#e3d5bf}
  .st .sr i{font-style:normal}
  .st .sr i.on{color:#ffb800}
  .st .cp{position:absolute;top:calc(96% + var(--s)*.26);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:max(11px,calc(var(--s)*.13));font-weight:600;color:#6d5f86}
  .st.lock{background:#ddd3c4;filter:grayscale(.9)}
  .st.lock .lk{position:absolute;right:-10%;top:-10%;font-size:calc(var(--s)*.3)}
  .st.next{animation:breathe2 1.4s ease-in-out infinite}
  .deco{position:absolute;transform:translate(-50%,-50%);font-size:var(--d);line-height:1;pointer-events:none;opacity:.9}
  .walker{position:absolute;transform:translate(-50%,-100%);width:var(--w);pointer-events:none;animation:hopk 1.6s ease-in-out infinite;z-index:2}
  .walker svg{display:block;width:100%;height:auto}
  .exFab{position:absolute;z-index:4;right:calc(var(--u)*2.4);bottom:calc(var(--u)*2.4 + env(safe-area-inset-bottom));width:max(64px,calc(var(--u)*16));height:max(64px,calc(var(--u)*16));
         border-radius:32%;background:var(--sky);border:var(--ol);box-shadow:var(--hs);font-size:max(30px,calc(var(--u)*8));display:grid;place-items:center;transform:rotate(6deg)}
  .exFab:active{transform:rotate(6deg) translate(4px,4px);box-shadow:none}

  /* ===== PLAY: field + Bubu's dock with a comic speech bubble ===== */
  .pl{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-rows:1fr auto;grid-template-areas:"f" "d"}
  @media (orientation:landscape){.pl{grid-template-columns:min(34vw,calc(var(--u)*48)) 1fr;grid-template-rows:100%;grid-template-areas:"d f"}}
  .field{grid-area:f;position:relative;min-height:0;min-width:0;overflow:hidden;padding:calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*2)}
  .dock{grid-area:d;position:relative;display:flex;align-items:flex-end;gap:calc(var(--u)*2);padding:0 calc(var(--u)*2.4) calc(var(--u)*1.8)}
  @media (orientation:landscape){.dock{flex-direction:column-reverse;align-items:flex-start;justify-content:flex-start;padding:calc(var(--u)*1) calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*2.4)}}
  #dockZ{flex:none;width:min(calc(var(--u)*18),22vw)}
  @media (orientation:landscape){#dockZ{width:min(calc(var(--u)*20),16vw)}}
  .say{position:relative;flex:1;min-width:0;background:#fff;border:var(--ol);box-shadow:var(--hs2);border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.2) calc(var(--u)*2.6);
       font-weight:600;font-size:clamp(16px,calc(var(--u)*4.6),30px);line-height:1.2;min-height:2.6em;display:flex;align-items:center;cursor:pointer;margin-bottom:calc(var(--u)*4)}
  .say:before{content:"";position:absolute;left:calc(var(--u)*-2.4);bottom:calc(var(--u)*2);border:calc(var(--u)*1.6) solid transparent;border-right:calc(var(--u)*2.4) solid var(--ink);border-left:0}
  .say:after{content:"";position:absolute;left:calc(var(--u)*-1.5);bottom:calc(var(--u)*2.3);border:calc(var(--u)*1.3) solid transparent;border-right:calc(var(--u)*1.8) solid #fff;border-left:0}
  @media (orientation:landscape){
    .say{flex:none;width:100%;margin:0 0 calc(var(--u)*2.6)}
    .say:before{left:calc(var(--u)*5);bottom:calc(var(--u)*-2.4);border:calc(var(--u)*1.6) solid transparent;border-top:calc(var(--u)*2.4) solid var(--ink);border-bottom:0}
    .say:after{left:calc(var(--u)*5.3);bottom:calc(var(--u)*-1.5);border:calc(var(--u)*1.3) solid transparent;border-top:calc(var(--u)*1.8) solid #fff;border-bottom:0}
  }
  .leaves{display:flex;gap:calc(var(--u)*1.6);align-items:center}
  .leaves i{width:max(16px,calc(var(--u)*4));height:max(16px,calc(var(--u)*4));border-radius:0 75% 0 75%;background:#fff;border:var(--ol);transform:rotate(-8deg)}
  .leaves i.done{background:var(--leaf)}
  .leaves i.cur{background:var(--mustard);animation:wig 1s ease-in-out infinite}

  .duo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:calc(var(--u)*2)}
  @media (orientation:landscape){.duo{flex-direction:row}}
  .ctr{height:100%;display:grid;place-items:center}
  .pa,.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);min-width:0;min-height:0}

  /* Bubu */
  .zz{position:relative;display:block;cursor:pointer}
  .zz svg{display:block;width:100%;height:auto;overflow:visible}
  .zz .zb{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
  .zz .zeye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  .zz .zm{display:none}
  .zz .m1{display:inline}
  .zz.oh .m1{display:none}
  .zz.oh .m4{display:inline}
  .zz.bite svg{animation:bite .28s}
  .zz.oh svg{animation:wob .5s}
  .zz.dance svg{animation:zdance .55s ease-in-out 4}
  .zz.dance .zal{transform-box:fill-box;transform-origin:80% 10%;animation:armL .55s ease-in-out 4}
  .zz.dance .zar{transform-box:fill-box;transform-origin:20% 10%;animation:armR .55s ease-in-out 4}
  .kidv svg{display:block;width:100%;height:auto}
  .kidv.dance svg{animation:zdance .6s ease-in-out infinite}

  /* cards */
  .cards{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3.4);justify-content:center;max-width:100%}
  .cards.n4{display:grid;grid-template-columns:repeat(2,auto)}
  .card{position:relative;width:min(calc(var(--u)*25),27vw,23vh);aspect-ratio:1;min-width:76px;background:#fff;border-radius:calc(var(--u)*4.5);border:var(--ol);box-shadow:var(--hs);
        display:grid;place-items:center;font-size:min(calc(var(--u)*14),15vw,12vh);line-height:1;transition:transform .12s,opacity .2s,box-shadow .12s}
  .card:nth-child(4n+1){transform:rotate(-2.5deg)}.card:nth-child(4n+2){transform:rotate(1.8deg)}.card:nth-child(4n+3){transform:rotate(-1deg)}.card:nth-child(4n){transform:rotate(2.4deg)}
  @media (orientation:landscape){.card{width:min(calc(var(--u)*25),17vw)}}
  .card:active{box-shadow:none;translate:calc(var(--u)*.9) calc(var(--u)*.9)}
  .card[disabled]{opacity:.3;cursor:default;box-shadow:none}
  .card.yes{background:#dbffe2;animation:pop .45s}
  .card svg.shp{width:76%;height:76%}
  .card.wide{width:min(calc(var(--u)*30),28vw);aspect-ratio:1.15}
  @media (orientation:landscape){.card.wide{width:min(calc(var(--u)*30),20vw)}}
  .scn{position:absolute;inset:7%;border-radius:calc(var(--u)*3);border:var(--ol);display:grid;grid-template-columns:1fr 1fr;place-items:center;font-size:min(calc(var(--u)*8.5),8vw)}
  .card.sz{width:min(calc(var(--u)*34),40vw);aspect-ratio:1}
  @media (orientation:landscape){.card.sz{width:min(calc(var(--u)*32),26vw)}}
  .card.sz .e{display:block;line-height:1}
  .card.sz svg{display:block}
  .bigbtn{width:min(calc(var(--u)*24),28vw,22vh);aspect-ratio:1;border-radius:32%;background:var(--mustard);border:var(--ol);box-shadow:var(--hs);font-size:min(calc(var(--u)*12),14vw,11vh);display:grid;place-items:center;animation:breathe2 1.4s ease-in-out infinite}
  .bigbtn:active{box-shadow:none;translate:4px 4px}

  /* balloons */
  .sky{position:relative;width:100%;height:100%}
  .bl{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*20);height:calc(var(--u)*30);min-width:66px;min-height:99px}
  .bl .in{position:absolute;inset:0;animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
  .bl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .bl .bb{fill:var(--c);stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
  .bl[disabled] .in{opacity:.3}
  .bl.pop .in{animation:popb .35s forwards}
  .bl.away .in{animation:away 1.3s ease-in forwards}

  /* paint */
  .pobj{font-size:min(calc(var(--u)*26),30vw,26vh);line-height:1;transition:filter .7s;background:#fff;border:var(--ol);box-shadow:var(--hs);border-radius:50%;width:1.45em;height:1.45em;display:grid;place-items:center}
  .pobj.gray{filter:grayscale(1) brightness(1.15) contrast(.8)}
  .pobj.yes{animation:pop .5s}
  .pots{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center}
  .pot{width:min(calc(var(--u)*19),25vw,20vh);min-width:66px;transition:transform .12s,opacity .2s}
  .pot svg{display:block;width:100%;height:auto;overflow:visible}
  .pot:active{transform:translateY(3px)}
  .pot[disabled]{opacity:.3}
  .pot.yes{animation:pop .45s}

  /* shape sorter */
  .srt{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:calc(var(--u)*2)}
  .board{display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*3);background:#e6ac6a;border:var(--ol);border-radius:calc(var(--u)*5);box-shadow:var(--hs)}
  .hole,.piece{width:min(calc(var(--u)*20),24vw,22vh);aspect-ratio:1;min-width:64px;display:grid;place-items:center;border-radius:calc(var(--u)*3);transition:transform .15s}
  .hole{background:#f8dfbd;border:var(--ol)}
  .hole.over{transform:scale(1.08);background:#fff2dd}
  .hole.done{animation:pop .4s}
  .hole svg,.piece svg{width:84%;height:84%;display:block;overflow:visible}
  .pieces{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:center}
  .piece{touch-action:none}
  .piece.sel{transform:translateY(-8px) scale(1.1);filter:drop-shadow(5px 5px 0 var(--acc))}
  .piece[disabled]{visibility:hidden}

  /* fruit / vegetable */
  .fvw{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"i i" "f v";gap:calc(var(--u)*3);align-items:center;justify-items:center}
  @media (orientation:landscape){.fvw{grid-template-columns:1fr auto 1fr;grid-template-rows:100%;grid-template-areas:"f i v"}}
  .fvi{grid-area:i;font-size:min(calc(var(--u)*24),28vw,22vh);line-height:1;touch-action:none;animation:pop .45s}
  .bin{position:relative;width:min(calc(var(--u)*30),40vw,32vh);min-width:110px;background:#fff;border-radius:calc(var(--u)*5);border:var(--ol);box-shadow:var(--hs);
       padding:calc(var(--u)*1.5);display:flex;flex-direction:column;align-items:center;transition:transform .15s}
  .bin.f{grid-area:f;transform:rotate(-2deg)}.bin.v{grid-area:v;transform:rotate(2deg)}
  .bin svg{display:block;width:100%;height:auto;overflow:visible}
  .bin .ex{font-size:min(calc(var(--u)*7),8vw);line-height:1;letter-spacing:2px}
  .bin.over{transform:scale(1.06);background:#fff7d6}
  .bin.yes{background:#dbffe2;animation:pop .45s}

  /* pattern */
  .ptn{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;--cw:min(calc(var(--u)*14),12.5vw,15vh)}
  .row{display:flex;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.6);background:#fff;border:var(--ol);border-radius:calc(var(--u)*4);box-shadow:var(--hs)}
  .cell{width:var(--cw);height:var(--cw);display:grid;place-items:center;font-size:calc(var(--cw)*.78);line-height:1;border-radius:calc(var(--u)*2)}
  .cell svg{width:86%;height:86%;overflow:visible}
  .cell.q{background:#fff3c4;border:var(--bw) dashed var(--ink);font-weight:700;font-size:calc(var(--cw)*.6)}
  .cell.q b{animation:wig 1s ease-in-out infinite}
  .cell.hop{animation:hop .45s ease-in-out}
  .row .cell.in{animation:pop .4s}

  /* explore */
  .exTabs{display:flex;gap:4px;background:#fff;border:var(--ol);border-radius:16px;padding:4px;box-shadow:var(--hs2);flex-wrap:wrap;justify-content:center}
  .exTabs button{font-size:max(20px,calc(var(--u)*5.4));line-height:1.1;padding:2px 8px;border-radius:11px}
  .exTabs button.on{background:var(--mustard);box-shadow:inset 0 0 0 var(--bw) var(--ink)}

               autumn:{bg:'#ffd6a8',e:['🍂','🍁','☔','🍄']},winter:{bg:'#dcefff',e:['❄️','⛄','🧣','🛷']}};

/* ================= voice =================
   Recorded clips: audio/<lang>/<key>.mp3, listed in audio/manifest.js (window.AUD_PACK = {lang:{key:[text,ms]}}).
   The manifest text is also what the speech bubble shows. A sentence is a list of keys played
   back-to-back through two reusable <audio> elements (iOS mutes WebAudio with the silent switch).
   Web Speech is only a last resort when a clip is missing or fails to load. */

  if(!hasTTS||!text){done();return}
  const re=new RegExp('^'+S.lang,'i'),vs=voices.filter(x=>re.test(x.lang)),v=vs.find(x=>x.localService)||vs[0];
  if(!v&&voices.length){done();return}
  let fin=false,wd=0;const end=()=>{if(fin)return;fin=true;clearTimeout(wd);VO.abort=null;done()};
  VO.abort=()=>{try{speechSynthesis.cancel()}catch(e){}end()};
  try{
    const u=new SpeechSynthesisUtterance(text);
    if(v){u.voice=v;u.lang=v.lang}else u.lang=LANGTAG[S.lang];
    u.rate=.9;u.pitch=1.15;u.onend=end;u.onerror=end;

function confetti(n=90,x=innerWidth/2,y=innerHeight*.45,cols){
  cols=cols||['#ff7a6b','#ffcf4a','#3ec1b0','#7cc6ff','#b69cff','#5cc96b'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:7+Math.random()*7,c:rnd(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:110,k:Math.random()<.4});
  if(!fxOn){fxOn=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.strokeStyle=INK;cx.lineWidth=1.5;
    if(p.k){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill();cx.stroke()}else{cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*.66)}
    cx.restore()}
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  if(parts.length)requestAnimationFrame(loop);else{fxOn=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ================= small UI helpers ================= */
function setBubble(t){$('bubble').textContent=t||''}
function say(keys){S.last=keys;setBubble(T(keys));return speak(keys)}
function repeat(){if(S.last){setBubble(T(S.last));speak(S.last)}}
function shakeEl(el){if(!el)return;restart(el.querySelector('.in')||el,'shake')}
const nameOf=id=>T('n_'+id)||id;
function flyTo(src,dst,o={}){
  const dur=o.dur||520,arc=o.arc==null?-60:o.arc,sc=o.scale==null?.5:o.scale,fy=o.fy==null?.5:o.fy;
  return new Promise(res=>{
    const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
    const g=document.createElement('div');g.className='fly';g.innerHTML=o.html||src.innerHTML;
    g.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;font-size:${getComputedStyle(src).fontSize}`;
    document.body.appendChild(g);
    const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height*fy-(a.top+a.height/2);
    let done=false;const end=()=>{if(done)return;done=true;g.remove();res()};
    try{
      const an=g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5+arc}px) scale(1.1)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sc})`}],
        {duration:dur,easing:'ease-in-out',fill:'forwards'});
      an.onfinish=end;
    }catch(e){setTimeout(end,dur)}
    setTimeout(end,dur+250);
  });
}
/* drag & drop with Pointer Events onto one of several zones. Tap is handled by onclick. */
let dragCancel=null;
function dragify(el,zonesFn,onDrop){
  el.addEventListener('pointerdown',e=>{
    if(S.lock||el.disabled||(e.pointerType==='mouse'&&e.button!==0)||dragCancel)return;
    const sx=e.clientX,sy=e.clientY,id=e.pointerId;let ghost=null,over=null;
    try{el.setPointerCapture(id)}catch(_){}
    const hit=(x,y)=>{
      for(const z of zonesFn()){const r=z.getBoundingClientRect(),m=24;
        if(x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m)return z}
      return null;
    };
    const move=ev=>{
      if(ev.pointerId!==id)return;
      if(!ghost){
        const dx=ev.clientX-sx,dy=ev.clientY-sy;if(dx*dx+dy*dy<144)return;
        if(S.lock)return end(null);
        const r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('ghost');ghost.classList.remove('sel');
        ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.classList.add('lifted');
      }
      ghost.style.transform=`translate(${ev.clientX}px,${ev.clientY}px) translate(-50%,-50%) scale(1.12)`;
      const z=hit(ev.clientX,ev.clientY);if(z!==over){if(over)over.classList.remove('over');over=z;if(z)z.classList.add('over')}
    };
    const end=ev=>{
      if(ev&&ev.pointerId!==id)return;
      el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);
      dragCancel=null;try{el.releasePointerCapture(id)}catch(_){}
      if(over)over.classList.remove('over');
      if(!ghost)return;
      ghost.remove();el.classList.remove('lifted');
      el._noclick=true;setTimeout(()=>{el._noclick=false},120);
      const z=ev&&ev.type==='pointerup'?hit(ev.clientX,ev.clientY):null;
      if(z&&!S.lock&&el.isConnected)onDrop(z);
    };
    dragCancel=()=>end(null);
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  });
}
function onTap(el,fn){el.addEventListener('click',e=>{if(el._noclick)return;fn(e)})}
function focusFirst(){
  if(!S.kbd)return;
  const el=field.querySelector('.card:not([disabled]),.bl:not([disabled]),.pot:not([disabled]),.piece:not([disabled]),.bin');
  if(el){try{el.focus({preventScroll:true})}catch(e){el.focus()}}
}

/* ================= round flow ================= */
function deck(ids,n=ROUNDS){const out=[];let pool=[];while(out.length<n){if(!pool.length)pool=shuffle(ids);let v=pool.shift();if(out.length&&v===out[out.length-1]&&pool.length){pool.push(v);v=pool.shift()}out.push(v)}return out}
const SETS={
  shape:{ids:['circle','square','triangle','rect'],r:(id,i,cols)=>shapeSVG(id,COLORS[cols[i]])},
  farm:{ids:Object.keys(FARM),r:id=>FARM[id]},
  wild:{ids:Object.keys(WILD),r:id=>WILD[id]},
  body:{ids:Object.keys(BODY),r:id=>BODY[id]},
  season:{ids:Object.keys(SEASONS),r:id=>seasonHTML(id),ok:id=>['r_'+id],cls:'wide'},
  sound:{ids:Object.keys(SOUNDS),r:id=>SOUNDS[id],q:id=>['qs_'+id],ok:id=>['rs_'+id],no:id=>['rs_'+id],think:'🔊',
         avoid:(a,b)=>(a==='hen'&&b==='rooster')||(a==='rooster'&&b==='hen')}
};
function makePlan(st){
  switch(st.m){
    case 'balloon':return deck(BASIC);
    case 'pick':return deck(SETS[st.set].ids);
    case 'paint':{const ks=shuffle(Object.keys(PAINT));const out=[],used={};
      for(const k of ks){if(out.length>=ROUNDS)break;if(!used[PAINT[k][1]]){used[PAINT[k][1]]=1;out.push(k)}}return out}
    case 'sorter':return range(1,ROUNDS).map(i=>shuffle(i<=2?SHAPES.slice(0,4):SHAPES).slice(0,3));
    case 'fv':{const f=shuffle(Object.keys(FRUITS)).slice(0,3),v=shuffle(Object.keys(VEG)).slice(0,2);return shuffle(f.concat(v))}
    case 'size':return ['big','small','long','short',rnd(['big','small'])];
    case 'odd':return range(1,ROUNDS).map(()=>{const cs=shuffle(Object.keys(ODDCAT)),A=shuffle(ODDCAT[cs[0]]).slice(0,3),B=rnd(ODDCAT[cs[1]]);
      const items=shuffle(A.concat([B]));return{items,odd:items.indexOf(B)}});
    case 'pattern':{const types=['AB','AB','AAB','ABC','ABB'],pools=['col','fruit','animal','col','fruit'];
      return types.map((t,i)=>{const pk=pools[i],pool=shuffle(PATPOOL[pk]),n=t==='ABC'?3:2,it=pool.slice(0,n);
        const unit=t.split('').map(ch=>it[ch.charCodeAt(0)-65]),seq=[];while(seq.length<6)seq.push(...unit);
        const shown=seq.slice(0,5),ans=seq[5],opts=shuffle(n===3?it:it.concat([pool[n]]));return{pk,shown,ans,opts}})}
  }
}
function renderDots(){$('dots').innerHTML=range(0,ROUNDS-1).map(i=>`<i class="${i<S.round?'done':i===S.round?'cur':''}"></i>`).join('')}
function startStage(i){
  if(dragCancel)dragCancel();
  S.si=i;S.round=0;S.mist=0;S.plan=makePlan(STAGES[i]);
  window.L2R2Log&&L2R2Log.event('play_start','Mərhələ '+(i+1)+' ('+STAGES[i].id+')');
  closeOverlays();show('play');
  $('dockZ').innerHTML=bubu('');
  startRound();
}
function startRound(){
  S.tok++;S.lock=false;S.cool=0;S.last=null;
  if(dragCancel)dragCancel();
  const st=STAGES[S.si];
  field.innerHTML='';field.className='field';
  renderDots();
  MECH[st.m](st,S.plan[S.round],S.tok);
  focusFirst();
}
function nextRound(){S.round++;if(S.round>=ROUNDS)finishStage();else startRound()}
function praiseText(i){const p=T('praise_'+i),n=kidName();return n?p.replace(/[!.]+$/,'')+', '+n+'!':p}
function win(lines,extra=0){
  S.lock=true;const tok=S.tok;window.L2R2Log&&L2R2Log.count('düz');
  sfx.win();mood('happy');danceZ();confetti(70);
  const pi=Math.floor(Math.random()*7);
  let lt=T(lines||[]);if(lt&&!/[.!?]$/.test(lt))lt+='!';
  setBubble([lt,praiseText(pi)].filter(Boolean).join(' '));
  const nk=Math.random()<.5?nameKey('nm_'):'';          /* sometimes Bubu says the child's name too */
  const sp=speak([].concat(lines||[],'praise_'+pi,nk||[]));
  Promise.all([Promise.race([sp,wait(9000)]),wait(1500+extra)]).then(()=>{if(alive(tok))nextRound()});
}
/* wrong answer: Bubu says what the child picked (or a hint), then repeats the task */
function oops(el,lines){
  S.mist++;S.cool=Date.now()+650;window.L2R2Log&&L2R2Log.count('səhv');
  sfx.boing();mood('oh',900);shakeEl(el);
  const ks=lines&&lines.length?lines:['try_'+Math.floor(Math.random()*3)];
  setBubble(T(ks));speak(ks);
}
function finishStage(){
  S.tok++;S.lock=true;renderDots();
  const stars=S.mist===0?3:S.mist<=2?2:1,st=STAGES[S.si],id=st.id;
  window.L2R2Log&&L2R2Log.event('level_complete','Mərhələ '+(S.si+1)+' ('+id+'): '+stars+'⭐, '+S.mist+' səhv');
  if((prog.st[id]||0)<stars){prog.st[id]=stars;saveProg()}
  const sp=[...$('wst').children];sp.forEach(s=>s.classList.remove('on'));
  $('wBadge').textContent=st.icon;$('wBadge').style.setProperty('--c',SCOL[S.si]);
  $('wPals').innerHTML=`<div class="kidv dance">${kidSVG(S.kid)}</div>${bubu('')}`;
  $('wName').textContent=kidName()?praiseText(0):'';
  $('wNext').style.display=S.si<STAGES.length-1?'':'none';
  $('win').classList.add('on');
  const tok=S.tok;sfx.stick();
  sp.slice(0,stars).forEach((s,i)=>setTimeout(()=>{if(!alive(tok))return;s.classList.add('on');sfx.star(i)},550+i*450));
  setTimeout(()=>{if(alive(tok))confetti(140)},550+stars*450);
  speak(['stars_'+stars].concat(nameKey('nm_')||[]));
  if(S.kbd)setTimeout(()=>{if(alive(tok))$(S.si<STAGES.length-1?'wNext':'wAgain').focus()},50);
}

/* ================= mechanics ================= */
const MECH={};

/* 1) Balloons: pop the balloon of the spoken colour */
MECH.balloon=(st,c,tok)=>{
  const vals=shuffle([c].concat(shuffle(BASIC.filter(x=>x!==c)).slice(0,2)));
  field.innerHTML=`<div class="sky">${vals.map((v,i)=>{
    const x=(i+.5)/3*100,y=48+(Math.random()-.5)*18;
    return `<button class="bl" data-id="${v}" style="left:${x}%;top:${y}%;--c:${COLORS[v]};--d:${(-Math.random()*3).toFixed(2)}s" aria-label="${esc(nameOf(v))}"><span class="in">${BALLOON}</span></button>`;
  }).join('')}</div>`;
  field.querySelectorAll('.bl').forEach(b=>onTap(b,()=>{
    if(busy()||b.disabled)return;const v=b.dataset.id;
    if(v===c){
      const r=b.getBoundingClientRect();sfx.pop();confetti(36,r.left+r.width/2,r.top+r.height*.35,[COLORS[c]]);
      b.classList.add('pop');field.querySelectorAll('.bl').forEach(o=>{if(o!==b)o.classList.add('away')});
      win(['n_'+c],300);
    }else{b.disabled=true;oops(b,['n_'+v,'qb_'+c])}
  }));
  say(['qb_'+c]);
};

/* 2) Pick: "where is the cat?" — 3 picture cards (shapes, animals, body parts, seasons, animal sounds) */
MECH.pick=(st,id,tok)=>{
  const set=SETS[st.set],q=set.q||(x=>['q_'+x]),ok=set.ok||(x=>['n_'+x]),no=set.no||(x=>['n_'+x]);
  const others=shuffle(set.ids.filter(x=>x!==id&&!(set.avoid&&set.avoid(id,x)))).slice(0,2);
  const opts=shuffle([id].concat(others)),cols=shuffle(Object.keys(COLORS));
  const cards=`<div class="cards">${opts.map((o,i)=>`<button class="card ${set.cls||''}" data-id="${o}" aria-label="${esc(nameOf(o))}">${set.r(o,i,cols)}</button>`).join('')}</div>`;
  field.innerHTML=set.think?`<div class="duo"><div class="pa"><button class="bigbtn" id="think" data-ta="say">${set.think}</button></div><div class="pb">${cards}</div></div>`
                           :`<div class="ctr">${cards}</div>`;
  field.querySelectorAll('.card').forEach(b=>onTap(b,()=>{
    if(busy()||b.disabled)return;const v=b.dataset.id;
    if(v===id){b.classList.add('yes');win(ok(id))}
    else{b.disabled=true;oops(b,no(v).concat(q(id)))}
  }));
  if($('think'))$('think').onclick=repeat;
  say(q(id));
};

/* 3) Big / small, long / short */
MECH.size=(st,type,tok)=>{
  const len=type==='long'||type==='short',em=rnd(SIZEM),c=COLORS[rnd(Object.keys(COLORS))];
  const want=(type==='big'||type==='long')?'a':'b';
  const inner=k=>len?pencilSVG(k==='a'?170:60,c):`<span class="e" style="font-size:${k==='a'?'min(calc(var(--u)*24),26vw,22vh)':'min(calc(var(--u)*9),10vw,8vh)'}">${em}</span>`;
  const prop=k=>len?(k==='a'?'long':'short'):(k==='a'?'big':'small');
  field.innerHTML=`<div class="ctr"><div class="cards">${shuffle(['a','b']).map(k=>`<button class="card sz" data-k="${k}" aria-label="${esc(T('r_'+prop(k)))}">${inner(k)}</button>`).join('')}</div></div>`;
  field.querySelectorAll('.card').forEach(b=>onTap(b,()=>{
    if(busy()||b.disabled)return;const k=b.dataset.k;
    if(k===want){b.classList.add('yes');win(['r_'+type])}
    else{b.disabled=true;oops(b,['r_'+prop(k),'q_'+type])}
  }));
  say(['q_'+type]);
};

/* 4) Paint: the grey object gets its colour from the right paint pot */
MECH.paint=(st,obj,tok)=>{
  const [em,c]=PAINT[obj],opts=shuffle([c].concat(shuffle(Object.keys(COLORS).filter(x=>x!==c)).slice(0,2)));
  field.innerHTML=`<div class="duo paint"><div class="pa"><button class="pobj gray" id="pobj" data-ta="say">${em}</button></div>
    <div class="pb"><div class="pots">${opts.map(o=>`<button class="pot" data-id="${o}" aria-label="${esc(nameOf(o))}">${potSVG(COLORS[o])}</button>`).join('')}</div></div></div>`;
  const pobj=$('pobj');
  const tryIt=(b)=>{
    if(busy()||b.disabled)return;const v=b.dataset.id;
    if(v===c){
      b.classList.add('yes');sfx.splash();pobj.classList.remove('gray');restart(pobj,'yes');
      const r=pobj.getBoundingClientRect();confetti(50,r.left+r.width/2,r.top+r.height/2,[COLORS[c]]);
      win(['pr_'+obj],500);
    }else{b.disabled=true;oops(b,['n_'+v,'pq_'+obj])}
  };
  field.querySelectorAll('.pot').forEach(b=>{onTap(b,()=>tryIt(b));dragify(b,()=>[pobj],()=>tryIt(b))});
  pobj.onclick=repeat;
  say(['pq_'+obj]);
};

/* 5) Shape sorter: drag (or tap, then tap the hole) each shape into its hole */
MECH.sorter=(st,shapes,tok)=>{
  const cols=shuffle(Object.keys(COLORS)),colOf={};shapes.forEach((s,i)=>colOf[s]=COLORS[cols[i]]);
  field.innerHTML=`<div class="srt"><div class="board">${shuffle(shapes).map(s=>`<button class="hole" data-id="${s}" aria-label="${esc(nameOf(s))}">${shapeSVG(s,null,true)}</button>`).join('')}</div>
    <div class="pieces">${shuffle(shapes).map(s=>`<button class="piece" data-id="${s}" aria-label="${esc(nameOf(s))}">${shapeSVG(s,colOf[s])}</button>`).join('')}</div></div>`;
  let sel=null,left=shapes.length;
  const holes=()=>[...field.querySelectorAll('.hole:not(.done)')];
  const select=p=>{if(sel)sel.classList.remove('sel');sel=p;if(p){p.classList.add('sel');sfx.tap(1);speak(['n_'+p.dataset.id])}};
  const place=(p,h)=>{
    if(busy()||p.disabled||h.classList.contains('done'))return;
    const id=p.dataset.id;
    if(id!==h.dataset.id){select(null);oops(p,['n_'+id,'q_sort']);return}
    select(null);p.disabled=true;h.classList.add('done');h.innerHTML=shapeSVG(id,colOf[id]);sfx.plop();left--;
    if(!left)win(['n_'+id],300);else speak(['n_'+id]);
  };
  field.querySelectorAll('.piece').forEach(p=>{
    onTap(p,()=>{if(busy()||p.disabled)return;select(sel===p?null:p)});
    dragify(p,holes,h=>place(p,h));
  });
  field.querySelectorAll('.hole').forEach(h=>onTap(h,()=>{
    if(h.classList.contains('done')||busy())return;
    if(sel)place(sel,h);else speak(['n_'+h.dataset.id]);
  }));
  say(['q_sort']);
};

/* 6) Fruit or vegetable: put it into the basket (fruit) or the pot (vegetables) */
MECH.fv=(st,id,tok)=>{
  const isF=!!FRUITS[id],em=isF?FRUITS[id]:VEG[id];
  const exF=shuffle(Object.keys(FRUITS).filter(x=>x!==id)).slice(0,2).map(x=>FRUITS[x]).join('');
  const exV=shuffle(Object.keys(VEG).filter(x=>x!==id)).slice(0,2).map(x=>VEG[x]).join('');
  field.innerHTML=`<div class="fvw"><button class="bin f" data-k="f" aria-label="🧺"><span class="ex">${exF}</span>${BASKET}</button>
    <button class="fvi" id="fvi" data-ta="say">${em}</button>
    <button class="bin v" data-k="v" aria-label="🍲"><span class="ex">${exV}</span>${POT}</button></div>`;
  const fvi=$('fvi'),bins=[...field.querySelectorAll('.bin')];
  const tryIt=(bin,flew)=>{
    if(busy())return;
    if((bin.dataset.k==='f')===isF){
      S.lock=true;bin.classList.add('yes');
      const p=flew?Promise.resolve():flyTo(fvi,bin,{fy:.6,scale:.5});
      fvi.style.visibility='hidden';
      p.then(()=>{if(!alive(tok))return;sfx.plop();win(['r_'+id])});
    }else oops(bin,['r_'+id]);
  };
  bins.forEach(b=>onTap(b,()=>tryIt(b,false)));
  dragify(fvi,()=>bins,b=>tryIt(b,true));
  fvi.onclick=()=>{if(!fvi._noclick)speak(['n_'+id,'q_fv'])};
  say(['n_'+id,'q_fv']);
};

/* 7) Odd one out: 3 things from one group + 1 from another */
MECH.odd=(st,p,tok)=>{
  field.innerHTML=`<div class="ctr"><div class="cards n4">${p.items.map((e,i)=>`<button class="card" data-i="${i}" aria-label="${e}">${e}</button>`).join('')}</div></div>`;
  field.querySelectorAll('.card').forEach(b=>onTap(b,()=>{
    if(busy()||b.disabled)return;
    if(+b.dataset.i===p.odd){b.classList.add('yes');field.querySelectorAll('.card').forEach(o=>{if(o!==b)o.style.opacity='.45'});win([])}
    else{b.disabled=true;oops(b,['try_'+ri(0,2),'q_odd'])}
  }));
  say(['q_odd']);
};

/* 8) Pattern: what comes next? */
MECH.pattern=(st,p,tok)=>{
  const draw=v=>p.pk==='col'?shapeSVG('circle',COLORS[v]):v;

    <div class="cards">${p.opts.map(v=>`<button class="card" data-v="${v}" aria-label="${lbl(v)}">${draw(v)}</button>`).join('')}</div></div>`;

/* ================= explore: tap a picture, hear its name ================= */
const EXC=[
  {icon:'🎨',ids:Object.keys(COLORS),r:id=>blob(COLORS[id]),k:id=>['n_'+id]},
  {icon:'🔺',ids:SHAPES,r:(id,i)=>shapeSVG(id,Object.values(COLORS)[i%8]),k:id=>['n_'+id]},

];

/* ================= map: the trail ================= */
function renderTrail(){
  const track=$('track'),trail=$('trail'),u=UI[S.lang];
  const W=track.clientWidth||innerWidth,land=innerWidth>innerHeight;
  const s=Math.round(Math.max(64,Math.min(W*(land?.16:.24),124,innerHeight*(land?.24:.15)))),step=Math.round(s*1.75),top=Math.round(s*.85),amp=W*(land?.3:.26);
  const pts=STAGES.map((_,i)=>({x:W/2+Math.sin(i*Math.PI/2)*amp,y:top+i*step}));
  const H=top+(STAGES.length-1)*step+s*1.6;
  track.style.height=H+'px';
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];d+=` C${a.x} ${a.y+step*.55} ${b.x} ${b.y-step*.55} ${b.x} ${b.y}`}
  const rw=Math.max(18,s*.3);
  let tot=0,next=-1,html=`<svg class="road" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <path d="${d}" fill="none" stroke="${INK}" stroke-width="${rw+6}" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#f6dcae" stroke-width="${rw}" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="${Math.max(3,rw*.14)}" stroke-dasharray="${rw*.6} ${rw*.7}" stroke-linecap="round"/></svg>`;
  STAGES.forEach((st,i)=>{
    const p=pts[i],sw=Math.sin(i*Math.PI/2),dx=(sw===0?(i%4===0?1:-1):-sw)*amp*.95;
    html+=`<span class="deco" style="left:${p.x+dx}px;top:${p.y-s*.1}px;--d:${Math.round(s*.42)}px">${DECO[i]}</span>`;
  });
  STAGES.forEach((st,i)=>{
    const p=pts[i],stars=prog.st[st.id]||0,open=unlocked(i);tot+=stars;if(open&&!stars&&next<0)next=i;
    html+=`<button class="st ${open?'':'lock'}" data-i="${i}" style="left:${p.x}px;top:${p.y}px;--s:${s}px;--c:${SCOL[i]}" aria-label="${i+1}. ${esc(u.stg[i])}">
      ${st.icon}<span class="no">${i+1}</span><span class="sr">${[0,1,2].map(k=>`<i class="${k<stars?'on':''}">★</i>`).join('')}</span><span class="cp">${esc(u.stg[i])}</span>${open?'':'<span class="lk">🔒</span>'}</button>`;
  });
  const wi=next>=0?next:STAGES.length-1,wp=pts[wi],side=Math.sin(wi*Math.PI/2)>0?-1:1;
  html+=`<div class="walker" style="left:${wp.x+side*s*.78}px;top:${wp.y+s*.45}px;--w:${Math.round(s*.62)}px">${kidSVG(S.kid)}</div>`;
  track.innerHTML=html;
  if(next>=0)track.querySelector(`[data-i="${next}"]`).classList.add('next');
  $('totStars').textContent=tot;$('maxStars').textContent=STAGES.length*3;
  track.querySelectorAll('.st').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(!unlocked(i)){sfx.boing();restart(b,'shake');return}
    sfx.click();startStage(i);
  });
  trail.scrollTop=Math.max(0,wp.y-trail.clientHeight/2);
}

  if(S.scr==='map')renderTrail();
  warmClips();

/* keyboard / TV remote: arrows move focus spatially, Enter presses, Esc goes back */
function focusList(){
  const root=document.querySelector('.overlay.on')||document.querySelector('.screen.on');
  return [...root.querySelectorAll('button:not([disabled]),a[href],input')].filter(el=>{
    const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'});
}
function navMove(dir){
  const list=focusList();if(!list.length)return;
  const cur=document.activeElement;
  if(list.indexOf(cur)<0){list[0].focus();return}
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  let best=null,bs=1e9;
  for(const el of list){
    if(el===cur)continue;const r=el.getBoundingClientRect(),x=r.left+r.width/2-ax,y=r.top+r.height/2-ay;
    let m,c;
    if(dir==='ArrowRight'){m=x;c=y}else if(dir==='ArrowLeft'){m=-x;c=y}else if(dir==='ArrowDown'){m=y;c=x}else{m=-y;c=x}
    if(m<=4)continue;const s=m+Math.abs(c)*2.5;if(s<bs){bs=s;best=el}
  }
  if(best){best.focus();best.scrollIntoView&&best.scrollIntoView({block:'nearest'})}
}
function goBack(){
  if($('parent').classList.contains('on')){$('parent').classList.remove('on');return}
  if($('win').classList.contains('on')||S.scr==='play'||S.scr==='explore'){goMap();return}
  if(S.scr==='map')goHome();
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Escape'||e.key==='Enter'){e.target.blur();e.preventDefault()}return}
  S.kbd=true;
  const k=e.key;
  if(k&&k.indexOf('Arrow')===0){e.preventDefault();navMove(k);return}
  if(k==='Escape'||k==='Backspace'||k==='GoBack'||k==='BrowserBack'||e.keyCode===461||e.keyCode===10009){e.preventDefault();goBack();return}
});
addEventListener('pointerdown',()=>{S.kbd=false},true);
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{ac();unlockVoice()},true));
