<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Zuzu və Rəqəmlər</title>
<script src="../log.js"></script>
<meta name="description" content="Uşaqlar üçün rəqəm oyunu: saymaq, müqayisə, toplama və çıxma.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --u:min(1.1vw,1.1vh,12px);
    --ink:#33224a;--muted:#6b5a80;--pink:#ff4d8d;--purple:#8e5cf7;--yellow:#ffc928;--green:#22c55e;--blue:#3fa2ff;--orange:#ff8a3d;--teal:#2ec4b6;
    --sh:0 calc(var(--u)*1.1) 0 rgba(60,30,90,.14);
  }
  @supports (height:1dvh){:root{--u:min(1.1vw,1.1dvh,12px)}}
  @media (orientation:portrait){
    :root{--u:min(1.3vw,.95vh,12px)}
    @supports (height:1dvh){:root{--u:min(1.3vw,.95dvh,12px)}}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden}
  html{background:#fff3d6}
  body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#fff3d6;touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
  button:focus{outline:none}
  button:focus-visible,a:focus-visible{outline:max(4px,calc(var(--u)*.7)) solid var(--purple);outline-offset:3px}
  a{color:inherit}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;
          background:linear-gradient(180deg,#bfe6ff 0%,#e4f4ff 45%,#fff3d6 80%,#ffe9f0 100%);
          padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .screen.on{display:flex}
  .hill{position:absolute;left:-15%;right:-15%;bottom:-8%;height:24%;background:#8bd86f;border-radius:50% 50% 0 0;z-index:0;pointer-events:none}
  .hill:after{content:"";position:absolute;left:30%;right:-10%;top:30%;bottom:0;background:#6cc552;border-radius:50% 50% 0 0}
  .floaty{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .floaty span{position:absolute;font-weight:800;opacity:.22;font-size:calc(var(--u)*9);animation:drift 14s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(calc(var(--u)*3),calc(var(--u)*-5)) rotate(10deg)}}

  /* top bar */
  .top{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.4) calc(var(--u)*2)}
  .ib{flex:none;width:max(46px,calc(var(--u)*10.5));height:max(46px,calc(var(--u)*10.5));border-radius:50%;background:#fff;
      font-size:max(22px,calc(var(--u)*5.2));display:grid;place-items:center;box-shadow:var(--sh);line-height:1;transition:transform .12s}
  .ib:active{transform:translateY(3px)}
  .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8)}
  .bub{max-width:100%;background:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*.5) calc(var(--u)*3);font-weight:700;
       font-size:clamp(15px,calc(var(--u)*4.2),30px);line-height:1.2;text-align:center;box-shadow:var(--sh);min-height:1.2em;cursor:pointer}
  .dots{display:flex;gap:calc(var(--u)*1.2)}
  .dots i{width:max(10px,calc(var(--u)*2.4));height:max(10px,calc(var(--u)*2.4));border-radius:50%;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 2px #d9cbe8}
  .dots i.done{background:var(--yellow);box-shadow:none}
  .dots i.cur{background:var(--purple);box-shadow:none;animation:pulse 1.2s ease-in-out infinite}
  .langs{display:flex;gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--sh)}
  .langs button{font-weight:800;font-size:max(15px,calc(var(--u)*3.4));color:var(--muted);padding:2px 12px;border-radius:10px}
  .langs button.on{background:var(--purple);color:#fff}
  .pill{background:#fff;border-radius:99px;padding:2px 16px;font-weight:800;font-size:max(18px,calc(var(--u)*4.4));box-shadow:var(--sh)}
  .grow{flex:1}

  /* HOME */
  .hm{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);padding:0 calc(var(--u)*3) calc(var(--u)*4)}
  .hm .txt{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.5)}
  @media (orientation:landscape){.hm{flex-direction:row;gap:calc(var(--u)*8)}}
  .title{margin:0;text-align:center;line-height:.95}
  .title b{display:block;font-size:calc(var(--u)*17);letter-spacing:1px;
       background:linear-gradient(90deg,#ff4d8d,#ff8a3d,#ffc928,#22c55e,#3fa2ff,#8e5cf7);-webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 calc(var(--u)*.8) 0 rgba(255,255,255,.9))}
  .title small{display:block;font-size:calc(var(--u)*7);font-weight:800;color:var(--ink)}
  #homeZ{width:calc(var(--u)*44);cursor:pointer}
  .go{width:calc(var(--u)*24);height:calc(var(--u)*24);min-width:84px;min-height:84px;border-radius:50%;background:var(--green);color:#fff;
      font-size:max(36px,calc(var(--u)*11));box-shadow:0 calc(var(--u)*1.4) 0 #15964a;display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite;padding-left:.12em}
  .vnote{position:relative;z-index:1;margin:0 auto calc(var(--u)*2);max-width:640px;padding:0 16px;text-align:center;font-size:14px;font-weight:700;color:#4b3a66}
  .vnote:empty{display:none}
  .vnote span{background:rgba(255,255,255,.85);border-radius:12px;padding:2px 10px;display:inline-block}

  /* MAP */
  .stages{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;
          grid-template-columns:repeat(auto-fill,minmax(max(92px,calc(var(--u)*19)),1fr));gap:calc(var(--u)*2.6);
          padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*8);align-content:start;width:100%;max-width:1100px;margin:0 auto}
  .stg{position:relative;background:var(--c);color:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*1.6) 4px calc(var(--u)*1.2);
       display:flex;flex-direction:column;align-items:center;box-shadow:0 calc(var(--u)*1.2) 0 rgba(0,0,0,.18);transition:transform .15s}
  .stg:active{transform:translateY(3px)}
  .stg .sn{position:absolute;top:calc(var(--u)*-1.6);left:calc(var(--u)*-1.2);width:max(26px,calc(var(--u)*7));height:max(26px,calc(var(--u)*7));border-radius:50%;
           background:#fff;color:var(--ink);font-weight:800;font-size:max(15px,calc(var(--u)*3.8));display:grid;place-items:center;box-shadow:var(--sh)}
  .stg .si{font-size:max(34px,calc(var(--u)*10));line-height:1.15}
  .stg small{font-weight:800;font-size:max(14px,calc(var(--u)*3.6));opacity:.95;line-height:1.1}
  .stg .ss{font-size:max(18px,calc(var(--u)*4.6));letter-spacing:2px;color:#fff3a8;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .stg.lock{filter:grayscale(.85);opacity:.55}
  .stg .lk{position:absolute;right:calc(var(--u)*-1);top:calc(var(--u)*-1.4);font-size:max(20px,calc(var(--u)*5))}
  .stg.next{animation:pulse 1.3s ease-in-out infinite}
  .stg.ex{background:linear-gradient(135deg,#ffc928,#ff8a3d)}

  /* PLAY */
  .field{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden;padding:calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*2)}
  .duo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:calc(var(--u)*2)}
  @media (orientation:landscape){.duo{flex-direction:row}}
  .pa,.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);min-width:0;min-height:0}
  .choices{display:flex;gap:calc(var(--u)*3);justify-content:center;flex-wrap:wrap}
  .ch{width:calc(var(--u)*18);height:calc(var(--u)*18);min-width:56px;min-height:56px;border-radius:calc(var(--u)*5);background:var(--c);color:#fff;
      font-size:max(30px,calc(var(--u)*11.5));font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:0 calc(var(--u)*1.2) 0 rgba(0,0,0,.22);
      text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .12s,opacity .2s;touch-action:none}
  .ch:active{transform:translateY(3px)}
  .ch[disabled]{opacity:.3;cursor:default}
  .ch.yes{animation:pop .45s}
  .okb{width:calc(var(--u)*17);height:calc(var(--u)*17);min-width:58px;min-height:58px;border-radius:50%;background:var(--green);color:#fff;
       font-size:max(30px,calc(var(--u)*9));font-weight:800;display:grid;place-items:center;box-shadow:0 calc(var(--u)*1.2) 0 #15964a}
  .okb:active{transform:translateY(3px)}
  .zz{position:relative;display:block;cursor:pointer}
  .zz svg{display:block;width:100%;height:auto;overflow:visible}
  .zz .zb{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
  .zz .zeye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  .zz .zm,.zz .zlid{display:none}
  .zz .m1{display:inline}
  .zz.open .m1,.zz.chew .m1,.zz.oh .m1{display:none}
  .zz.open .m2,.zz.chew .m3,.zz.oh .m4,.zz.full .zlid{display:inline}
  .zz.bite svg{animation:bite .28s}
  .zz.oh svg{animation:wob .5s}
  .zz.dance svg{animation:zdance .55s ease-in-out 4}
  .zz.dance .zal{transform-box:fill-box;transform-origin:80% 10%;animation:armL .55s ease-in-out 4}
  .zz.dance .zar{transform-box:fill-box;transform-origin:20% 10%;animation:armR .55s ease-in-out 4}
  .zhit{border-radius:30%;transition:transform .15s}
  .zhit.over{transform:scale(1.08)}

  .sign{position:relative;display:flex;flex-direction:column;align-items:center;flex:none}
  .sign b{display:grid;place-items:center;min-width:calc(var(--u)*15);height:calc(var(--u)*13);padding:0 calc(var(--u)*1.5);background:#fff;border:calc(var(--u)*1) solid #e0a96d;
          border-radius:calc(var(--u)*3);font-size:calc(var(--u)*11);font-weight:800;line-height:1;box-shadow:var(--sh)}
  .sign:after{content:"";width:calc(var(--u)*1.6);height:calc(var(--u)*7);background:#b9783a;border-radius:0 0 4px 4px}

  .tf{display:grid;grid-template-columns:repeat(5,calc(var(--u)*5));grid-auto-rows:calc(var(--u)*5);gap:calc(var(--u)*.9);padding:calc(var(--u)*1.1);background:#fff;border-radius:calc(var(--u)*2);box-shadow:var(--sh)}
  .tf i{border-radius:50%;background:#efe6f7}
  .tf i.on{background:var(--pink);animation:pop .3s}
  .tf.b i.on{background:var(--blue)}

  /* feed */
  .zbox{display:flex;align-items:flex-end;gap:calc(var(--u)*1)}
  .feed .zhit .zz{width:calc(var(--u)*34)}
  .plate{display:grid;grid-template-columns:repeat(4,calc(var(--u)*12.5));grid-auto-rows:calc(var(--u)*12.5);gap:calc(var(--u)*.8);padding:calc(var(--u)*2.5) calc(var(--u)*3.5);
         background:radial-gradient(ellipse at center,#fff 55%,#ffe3ec 100%);border-radius:calc(var(--u)*8);box-shadow:var(--sh);justify-content:center}
  .food{font-size:calc(var(--u)*9);line-height:1;display:grid;place-items:center;border-radius:calc(var(--u)*3);touch-action:none;transition:transform .12s}
  .food:active{transform:scale(1.15)}
  .food.gone{visibility:hidden}
  .lifted{opacity:.25}
  .ghost{position:fixed!important;left:0!important;top:0!important;z-index:60;pointer-events:none;margin:0!important;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
  .fly{position:fixed;z-index:55;pointer-events:none;display:grid;place-items:center;line-height:1}
  .fnum{position:fixed;z-index:56;pointer-events:none;font-weight:800;font-size:calc(var(--u)*12);transform:translate(-50%,-50%);animation:fnum 1s ease-out forwards;
        text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}

  /* balloons */
  .sky{position:relative;width:100%;height:100%}
  .bl{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*18);height:calc(var(--u)*27);min-width:60px;min-height:90px}
  .bl .in{position:absolute;inset:0;animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
  .bl svg{position:absolute;inset:0;width:100%;height:100%}
  .bl .bb{fill:var(--c)}
  .bl b{position:absolute;left:0;right:0;top:12%;text-align:center;color:#fff;font-size:max(30px,calc(var(--u)*11));font-weight:800;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
  .bl[disabled] .in{opacity:.35}
  .bl.pop .in{animation:popb .35s forwards}
  .bl.away .in{animation:away 1.3s ease-in forwards}

  /* count / tens */
  .meadow{position:relative;flex:1 1 auto;align-self:stretch;min-height:0;border-radius:calc(var(--u)*6);
          background:radial-gradient(ellipse at 50% 120%,#a9e58f 0,#c9f1b5 60%,#e3f9d6 100%);box-shadow:inset 0 0 0 calc(var(--u)*1) rgba(255,255,255,.7)}
  .crit{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*14);height:calc(var(--u)*14);min-width:50px;min-height:50px}
  .crit .in{position:absolute;inset:0;display:grid;place-items:center;font-size:max(32px,calc(var(--u)*10));line-height:1;animation:idle 2.4s ease-in-out infinite;animation-delay:var(--d)}
  .crit i,.egg i{position:absolute;top:-6%;right:-6%;min-width:max(22px,calc(var(--u)*5.5));height:max(22px,calc(var(--u)*5.5));border-radius:99px;background:var(--purple);color:#fff;
         font-style:normal;font-weight:800;font-size:max(14px,calc(var(--u)*3.8));display:none;place-items:center;line-height:1;padding:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .crit.counted i,.egg.counted i{display:grid;animation:pop .3s}
  .crit.counted .in{animation:hop .4s}
  .hopall .crit .in{animation:hop .5s ease-in-out 3}
  @media (orientation:landscape){.count .choices,.tens .choices,.place .choices{flex-direction:column}}

  /* match */
  .match .zz{width:calc(var(--u)*24)}
  .cards{display:flex;gap:calc(var(--u)*2.5);justify-content:center}
  .card{position:relative;width:calc(var(--u)*22);height:calc(var(--u)*22);min-width:84px;min-height:84px;background:#fff;border-radius:calc(var(--u)*4);box-shadow:var(--sh);border:calc(var(--u)*.8) solid #efe6f7}
  .card span{position:absolute;transform:translate(-50%,-50%);font-size:max(16px,calc(var(--u)*4.4));line-height:1}
  .card.big span{font-size:max(14px,calc(var(--u)*3.6))}
  .card[disabled]{opacity:.35}
  .card.yes{border-color:var(--green);animation:pop .45s}

  /* tower */
  .tw{height:100%;display:grid;grid-template-columns:auto auto auto;grid-template-rows:100%;justify-content:space-evenly;align-items:end;gap:calc(var(--u)*2)}
  .twL{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1);padding-bottom:calc(var(--u)*2)}
  .twL .zz{width:calc(var(--u)*22)}
  .twC{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .tower{height:calc(100% - var(--u)*3);display:flex;flex-direction:column-reverse;justify-content:flex-start;align-items:center;transition:transform .3s}
  .blk{flex:none;height:min(8.6%,calc(var(--u)*15));width:calc(var(--u)*16);min-width:56px;background:var(--c);color:#fff;border-radius:calc(var(--u)*1.6);
       font-weight:800;font-size:max(14px,calc(var(--u)*5.5));line-height:1;display:grid;place-items:center;box-shadow:inset 0 calc(var(--u)*-.8) 0 rgba(0,0,0,.18);
       margin-top:2px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .blk.drop{animation:drop .3s ease-out}
  .tower.wave .blk{animation:hop .45s ease-in-out}
  .tower.wob{animation:wob .5s}
  .twC.over .ground{background:var(--purple)}
  .ground{width:calc(var(--u)*21);height:calc(var(--u)*3);background:#a0612b;border-radius:99px;flex:none;transition:background .15s}
  .twR{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);padding-bottom:calc(var(--u)*2)}
  .pile{position:relative;width:calc(var(--u)*19);height:calc(var(--u)*19);min-width:64px;min-height:64px;background:#fff;border-radius:calc(var(--u)*4);box-shadow:var(--sh);
        display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;padding:calc(var(--u)*1.4);touch-action:none}
  .pile s{display:block;width:60%;height:22%;border-radius:4px;margin-top:2px}
  .pile b{position:absolute;right:-8%;top:-8%;width:42%;height:42%;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:max(20px,calc(var(--u)*6));line-height:1}
  .minus{font-weight:800}
  .flag{position:relative;width:calc(var(--u)*17);height:calc(var(--u)*20);flex:none}
  .flag:before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*1.4);background:#8a5a2b;border-radius:4px}
  .flag b{position:absolute;left:calc(var(--u)*1.4);top:calc(var(--u)*1);width:calc(var(--u)*15);height:calc(var(--u)*12);background:var(--c);color:#fff;border-radius:0 calc(var(--u)*2) calc(var(--u)*2) 0;
          display:grid;place-items:center;font-size:calc(var(--u)*9);font-weight:800;line-height:1;animation:flap 1.6s ease-in-out infinite;transform-origin:left center}

  /* train */
  .trn{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;--cw:min(calc(var(--u)*13),13.5vw)}
  .trk{width:100%;display:flex;flex-direction:column;align-items:center}
  .train{display:flex;align-items:flex-end;gap:calc(var(--u)*1);animation:tin 1s ease-out}
  .train.go{transition:transform 1.6s ease-in;transform:translateX(120vw)}
  .car{position:relative;width:var(--cw);height:calc(var(--cw)*.8);background:var(--c);border-radius:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*1) calc(var(--u)*1);
       display:grid;place-items:center;margin-bottom:calc(var(--cw)*.16);box-shadow:inset 0 calc(var(--u)*-1) 0 rgba(0,0,0,.15)}
  .car:before,.car:after{content:"";position:absolute;bottom:calc(var(--cw)*-.16);width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);border-radius:50%;background:#3d3350;border:3px solid #9a8fb0}
  .car:before{left:8%}.car:after{right:8%}
  .car b{color:#fff;font-size:calc(var(--cw)*.56);font-weight:800;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
  .car.gap{background:#fff;border:calc(var(--u)*.8) dashed var(--purple)}
  .car.gap b{color:var(--purple);animation:pulse 1s ease-in-out infinite}
  .car.gap.over{background:#efe6ff}
  .car.hop{animation:hop .45s ease-in-out}
  .eng{width:calc(var(--cw)*1.3);flex:none}
  .eng svg{display:block;width:100%;height:auto}
  .rail{width:100%;height:calc(var(--u)*2.2);margin-top:2px;background:repeating-linear-gradient(90deg,#a0612b 0 calc(var(--u)*2.4),transparent calc(var(--u)*2.4) calc(var(--u)*5)),linear-gradient(#6b6b7b,#6b6b7b) top/100% calc(var(--u)*.7) no-repeat}

  /* compare */
  .cmp{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"z z" "a b";gap:calc(var(--u)*2);align-items:center;justify-items:center}
  @media (orientation:landscape){.cmp{grid-template-columns:1fr auto 1fr;grid-template-rows:100%;grid-template-areas:"a z b"}}
  .cz{grid-area:z;position:relative;display:flex;align-items:center;gap:calc(var(--u)*1)}
  .cz .zz{width:calc(var(--u)*25)}
  .think{background:#fff;border-radius:calc(var(--u)*5);padding:calc(var(--u)*1) calc(var(--u)*2.4);font-size:calc(var(--u)*6);line-height:1.1;box-shadow:var(--sh);text-align:center;font-weight:800}

let actx=null,noiseBuf=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(actx.state==='suspended'){try{actx.resume()}catch(e){}}
  return actx;
}
function tone(f,dur=.12,type='sine',delay=0,vol=.14,f2=0){
  if(!S.sfx)return;const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
function noise(dur=.08,delay=0,vol=.12,freq=1500){
  if(!S.sfx)return;const a=ac();if(!a)return;
  try{
    if(!noiseBuf){noiseBuf=a.createBuffer(1,Math.floor(a.sampleRate*.5),a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+delay;
    s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.02);
  }catch(e){}
}

/* ================= voice =================
   Recorded clips: audio/<lang>/<key>.mp3, listed in audio/manifest.js (window.AUD_PACK).
   A sentence is a list of keys played back-to-back through two reusable <audio>
   elements (one plays, the other preloads the next clip). HTMLAudioElement is used
   for the voice because iOS mutes WebAudio with the silent switch.
   Web Speech is only a last resort when a clip is missing or fails to load. */
const PACK=window.AUD_PACK||{};
const LANGTAG={az:'az-AZ',ru:'ru-RU',en:'en-US'};
const hasTTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(hasTTS){try{loadVoices();speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',loadVoices):(speechSynthesis.onvoiceschanged=loadVoices)}catch(e){}}
function ttsSay(text,done){
  if(!hasTTS||!text){done();return}
  const re=new RegExp('^'+S.lang,'i'),vs=voices.filter(x=>re.test(x.lang)),v=vs.find(x=>x.localService)||vs[0];
  if(!v&&voices.length){done();return}          /* no voice for this language: stay silent, never a wrong accent */
  let fin=false,wd=0;const end=()=>{if(fin)return;fin=true;clearTimeout(wd);VO.abort=null;done()};
  VO.abort=()=>{try{speechSynthesis.cancel()}catch(e){}end()};
  try{
    const u=new SpeechSynthesisUtterance(text);
    if(v){u.voice=v;u.lang=v.lang}else u.lang=LANGTAG[S.lang];
    u.rate=.9;u.pitch=1.15;u.onend=end;u.onerror=end;
    wd=setTimeout(end,1800+text.length*110);
    speechSynthesis.speak(u);
  }catch(e){end()}
}

  const l=S.lang,a=VO.els[VO.cur],b=VO.els[1-VO.cur],url=clipUrl(k),ms=PACK[l][k][1]||1500;
  let fin=false;

    if(tok!==spTok)return done();

  try{a.currentTime=0}catch(e){}

  if(p&&p.catch)p.catch(err=>{

}

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;

function confetti(n=90,x=innerWidth/2,y=innerHeight*.45){
  const cols=['#ff6b6b','#ff9f43','#1dd1a1','#54a0ff','#a55eea','#ff6fb5','#ffd32a'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:6+Math.random()*7,c:rnd(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:110});

function loop(){

  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()}

}

/* answer options: the right one + nearest neighbours inside [lo,hi] */
/* place-value distractors for 2-digit numbers: swapped digits, ±10, ±1 */
function pvOpts(n,k,lo,hi){
  const t=Math.floor(n/10),o=n%10;
  const c=(o&&o!==t&&t<10?[o*10+t]:[]).concat(shuffle([n+10,n-10]),shuffle([n+1,n-1]),shuffle([n+11,n-11,n+9,n-9]));
  const out=[n];for(const v of c){if(out.length>=k)break;if(v>=lo&&v<=hi&&out.indexOf(v)<0)out.push(v)}
  for(let v=lo;out.length<k&&v<=hi;v++)if(out.indexOf(v)<0)out.push(v);
  return shuffle(out);
}
function opts(ans,lo,hi,k=3){
  const near=[];for(let d=1;d<=4;d++){if(ans-d>=lo)near.push(ans-d);if(ans+d<=hi)near.push(ans+d)}
  const out=[ans];for(const v of shuffle(near.slice(0,Math.max(4,k+1)))){if(out.length>=k)break;out.push(v)}
  for(let v=lo;out.length<k&&v<=hi;v++)if(out.indexOf(v)<0)out.push(v);
  return shuffle(out);
}

}

    document.body.appendChild(g);

/* drag & drop with Pointer Events (touch + mouse + pen). Tap is handled by onclick. */
let dragCancel=null;
function dragify(el,zoneFn,onDrop){
  el.addEventListener('pointerdown',e=>{
    if(S.lock||el.disabled||(e.pointerType==='mouse'&&e.button!==0)||dragCancel)return;
    const sx=e.clientX,sy=e.clientY,id=e.pointerId;let ghost=null,over=null;
    try{el.setPointerCapture(id)}catch(_){}
    const hit=(x,y)=>{const z=zoneFn();if(!z)return null;const r=z.getBoundingClientRect(),m=28;
      return(x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m)?z:null};
    const move=ev=>{
      if(ev.pointerId!==id)return;
      if(!ghost){
        const dx=ev.clientX-sx,dy=ev.clientY-sy;if(dx*dx+dy*dy<144)return;
        if(S.lock)return end(null);
        const r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('ghost');
        ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.classList.add('lifted');
      }
      ghost.style.transform=`translate(${ev.clientX}px,${ev.clientY}px) translate(-50%,-50%) scale(1.12)`;
      const z=hit(ev.clientX,ev.clientY);if(z!==over){if(over)over.classList.remove('over');over=z;if(z)z.classList.add('over')}
    };
    const end=ev=>{
      if(ev&&ev.pointerId!==id)return;
      el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);
      dragCancel=null;try{el.releasePointerCapture(id)}catch(_){}
      if(over)over.classList.remove('over');
      if(!ghost)return;
      ghost.remove();el.classList.remove('lifted');
      el._noclick=true;setTimeout(()=>{el._noclick=false},120);
      const z=ev&&ev.type==='pointerup'?hit(ev.clientX,ev.clientY):null;
      if(z&&!S.lock&&el.isConnected)onDrop();

  });

/* ================= round flow ================= */
function deck(lo,hi){
  const out=[];let pool=[];
  while(out.length<ROUNDS){if(!pool.length)pool=shuffle(range(lo,hi));let v=pool.shift();
    if(out.length&&v===out[out.length-1]&&pool.length){pool.push(v);v=pool.shift()}out.push(v)}
  return out;
}
function makePlan(st){
  const R=range(0,ROUNDS-1);
  switch(st.m){
    case 'train':if(st.big)return R.map(i=>{
        if(i>=3){const t0=ri(1,6),seq=range(t0,t0+4).map(x=>x*10),mi=ri(0,4),ans=seq[mi];   /* count by tens */
          return{seq,mi,ch:shuffle([ans].concat(shuffle([ans-10,ans+10,ans-20,ans+20].filter(v=>v>=0&&v<=100)).slice(0,2)))}}
        const s=ri(20,95),seq=range(s,s+4),mi=i===0?ri(1,3):ri(0,4);return{seq,mi,ch:pvOpts(seq[mi],3,10,100)}});
      return R.map(i=>{const s=ri(0,6);const seq=range(s,s+4);if(i>=3)seq.reverse();return{seq,mi:i<2?ri(1,3):ri(0,4)}});
    case 'compare':return ['more','fewer','more','bigger','smaller'].map((type,i)=>{let a,b;const md=i<2?3:1;do{a=ri(1,10);b=ri(1,10)}while(Math.abs(a-b)<md);return{type,a,b}});
    case 'add':return R.map(i=>{const s=ri(2,i<2?5:10);const a=ri(1,s-1);return{a,b:s-a}});
    case 'sub':return R.map(i=>{const a=i<2?ri(2,5):ri(4,10);const b=(i===4&&Math.random()<.35)?a:ri(1,a-1);return{a,b}});
    case 'place':{const out=[];while(out.length<ROUNDS){const v=ri(st.lo,st.hi);if(v%10&&out.indexOf(v)<0)out.push(v)}return out}
    default:return deck(st.lo,st.hi);
  }
}

      <div class="zhit" id="zhit">${zuzu('open')}</div></div>${tenFrame('tf')}</div>
    <div class="pb"><div class="plate" id="plate">${range(1,total).map(()=>`<button class="food" aria-label="${fruit}">${fruit}</button>`).join('')}</div>
      ${auto?'':`<button class="okb" id="okb" aria-label="OK">✔</button>`}</div></div>`;
  const zhit=$('zhit'),cells=$('tf').children;
  let cnt=0,gen=0;
  const land=(k,g)=>{if(!alive(tok)||g!==gen)return;if(cells[k-1])cells[k-1].classList.add('on');chomp();speak(NK(k));floatNum(zhit,k)};
  const feedOne=(f,dropped)=>{
    if(S.lock||f.disabled)return;
    const g=gen;const p=dropped?Promise.resolve():flyTo(f,zhit,{fy:.6,scale:.45});
    f.disabled=true;f.classList.add('gone');cnt++;const k=cnt;
    p.then(()=>land(k,g));
    if(auto&&cnt===n){S.lock=true;p.then(()=>wait(650)).then(()=>{if(alive(tok))win([NK(n)])})}
  };
  field.querySelectorAll('.food').forEach(f=>{onTap(f,()=>feedOne(f,false));dragify(f,()=>zhit,()=>feedOne(f,true))});

    const okb=$('okb');

      if(busy())return;
      if(cnt===n)win([NK(n)]);
      else if(cnt<n)oops(okb,[L('few').s,L('feed',n).s]);
      else{
        oops(okb,[L('many').s,L('feed',n).s]);
        gen++;cnt=0;[...cells].forEach(c=>c.classList.remove('on'));
        field.querySelectorAll('.food').forEach(f=>{f.disabled=false;f.classList.remove('gone')});
      }
    };
  }
  $('sign').onclick=repeat;
  say(L('feed',n));
};

/* 2) Balloons: pop the balloon with the spoken numeral */
MECH.balloon=(st,n,tok)=>{
  const k=st.k,vals=st.pv?pvOpts(n,k,st.lo,st.hi):opts(n,st.lo,st.hi,k),cols=isLand()?k:Math.min(k,3),rows=Math.ceil(k/cols);
  const html=vals.map((v,i)=>{
    const r=Math.floor(i/cols),inRow=r<rows-1?cols:k-cols*(rows-1),c=i%cols;
    const x=(c+.5)/inRow*100,y=(r+.5)/rows*100+(Math.random()-.5)*(rows>1?6:16);
    return `<button class="bl" data-n="${v}" style="left:${x}%;top:${y}%;--c:${BCOL[i%BCOL.length]};--d:${(-Math.random()*3).toFixed(2)}s" aria-label="${v}">

      <ellipse class="bb" cx="50" cy="56" rx="44" ry="52"/><path class="bb" d="M43 106 L57 106 L50 115Z"/><ellipse cx="33" cy="34" rx="9" ry="16" fill="#fff" opacity=".45" transform="rotate(20 33 34)"/></svg><b>${v}</b></span></button>`;
  }).join('');

  field.querySelectorAll('.bl').forEach(b=>onTap(b,()=>{

      b.classList.add('pop');field.querySelectorAll('.bl').forEach(o=>{if(o!==b)o.classList.add('away')});

/* 5) Tower: build a tower exactly N blocks high, then press ✔ */
MECH.tower=(st,n,tok)=>{
  field.innerHTML=`<div class="tw">
    <div class="twL"><button class="flag" id="sign" style="--c:${col(n)}" aria-label="${n}"><b>${n}</b></button>${zuzu('happy')}</div>

  const tower=$('tower'),twC=$('twC'),okb=$('okb');let h=0;

/* 7) Compare: hungry Zuzu wants MORE, full Zuzu wants FEWER; also bigger / smaller numerals */
MECH.compare=(st,p,tok)=>{

  const want=wantMax?Math.max(p.a,p.b):Math.min(p.a,p.b),other=want===p.a?p.b:p.a,em=rnd(TREATS);
  S.base=p.type==='more'?'open':p.type==='fewer'?'full':'happy';
  const think=p.type==='more'?em+em+em:p.type==='fewer'?em:p.type==='bigger'?'<span style="font-size:1.5em">9</span> 1':'9 <span style="font-size:1.5em">1</span>';
  const side=(v,c)=>`<button class="side ${c}" data-n="${v}" aria-label="${v}">${numeric
    ?`<b class="bignum" style="color:${col(v)}">${v}</b>`
    :scatter(v,4,3,.18).map(q=>`<span style="left:${8+q.x*.84}%;top:${8+q.y*.84}%">${em}</span>`).join('')}</button>`;
  field.innerHTML=`<div class="cmp">${side(p.a,'a')}<div class="cz"><div class="think">${think}</div>${zuzu(S.base)}</div>${side(p.b,'b')}</div>`;
  const key={more:'isMore',fewer:'isFewer',bigger:'isBigger',smaller:'isSmaller'}[p.type];
  field.querySelectorAll('.side').forEach(b=>onTap(b,()=>{
    if(busy()||b.disabled)return;
    if(+b.dataset.n===want){b.classList.add('yes');const l=L(key,want,other);win([l.s],0,l.t)}
    else{b.disabled=true;oops(b,[L(p.type).s])}
  }));
  say(L(p.type));
};

}

/* keyboard / TV remote: arrows move focus spatially, digits answer, Esc goes back */
function focusList(){
  const root=document.querySelector('.overlay.on')||document.querySelector('.screen.on');
  return [...root.querySelectorAll('button:not([disabled]),a[href]')].filter(el=>{
    const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'});
}
function navMove(dir){
  const list=focusList();if(!list.length)return;
  const cur=document.activeElement;
  if(list.indexOf(cur)<0){list[0].focus();return}
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  let best=null,bs=1e9;
  for(const el of list){
    if(el===cur)continue;const r=el.getBoundingClientRect(),x=r.left+r.width/2-ax,y=r.top+r.height/2-ay;
    let m,c;
    if(dir==='ArrowRight'){m=x;c=y}else if(dir==='ArrowLeft'){m=-x;c=y}else if(dir==='ArrowDown'){m=y;c=x}else{m=-y;c=x}
    if(m<=4)continue;const s=m+Math.abs(c)*2.5;if(s<bs){bs=s;best=el}
  }
  if(best)best.focus();
}
function goBack(){
  if($('parent').classList.contains('on')){$('parent').classList.remove('on');return}
  if($('win').classList.contains('on')||S.scr==='play'||S.scr==='explore'){goMap();return}
  if(S.scr==='map')goHome();
}
addEventListener('keydown',e=>{
  S.kbd=true;
  const k=e.key;
  if(k&&k.indexOf('Arrow')===0){e.preventDefault();navMove(k);return}
  if(k==='Escape'||k==='Backspace'||k==='GoBack'||k==='BrowserBack'||e.keyCode===461||e.keyCode===10009){e.preventDefault();goBack();return}
  if(/^[0-9]$/.test(k)){
    const root=document.querySelector('.overlay.on')||document.querySelector('.screen.on');
    const b=root.querySelector(`[data-n="${k}"]:not([disabled])`);
    if(b){e.preventDefault();b.focus();b.click()}
  }
});
addEventListener('pointerdown',()=>{S.kbd=false},true);
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{ac();unlockVoice()},true));
addEventListener('resize',()=>{resize();if(dragCancel)dragCancel()});
